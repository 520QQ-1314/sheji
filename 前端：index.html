<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>无翻墙设计图片搜索</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#f5f5f5;padding:20px}
        .header{text-align:center;margin-bottom:30px}
        .search-box{max-width:700px;margin:0 auto;display:flex;gap:10px}
        input{flex:1;padding:12px 15px;border:1px solid #ddd;border-radius:8px;font-size:16px}
        button{padding:12px 20px;background:#007bff;color:white;border:0;border-radius:8px;cursor:pointer}
        .tab{display:flex;justify-content:center;gap:20px;margin:20px 0}
        .tab button{padding:8px 16px;background:#fff;color:#333;border:1px solid #ddd}
        .tab button.active{background:#007bff;color:white}
        .result{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;margin-top:20px}
        .item{background:white;border-radius:10px;overflow:hidden}
        .item img{width:100%;height:200px;object-fit:cover}
        .tip{text-align:center;color:#666;margin-top:10px}
    </style>
</head>
<body>
    <div class="header">
        <h1>🎨 Pinterest & Behance 图片搜索（无需VPN）</h1>
        <p class="tip">本地部署 | 免注册 | 免翻墙 | 直接搜索</p>
    </div>

    <div class="search-box">
        <input id="keyword" placeholder="输入关键词，例如：logo、ui、poster、illustration">
        <button onclick="search()">搜索</button>
    </div>

    <div class="tab">
        <button class="active" data-type="pinterest">Pinterest</button>
        <button data-type="behance">Behance</button>
    </div>

    <div class="result" id="result"></div>

    <script>
        let type = "pinterest";
        const tabs = document.querySelectorAll(".tab button");
        tabs.forEach(t => {
            t.onclick = () => {
                tabs.forEach(x => x.classList.remove("active"));
                t.classList.add("active");
                type = t.dataset.type;
            }
        });

        async function search() {
            const q = document.getElementById("keyword").value.trim();
            if (!q) return alert("请输入搜索词");
            const res = await fetch(`/api/${type}?q=${q}`);
            const data = await res.json();
            show(data.data || []);
        }

        function show(list) {
            const dom = document.getElementById("result");
            dom.innerHTML = "";
            list.forEach(item => {
                const img = document.createElement("div");
                img.className = "item";
                img.innerHTML = `<a href="${item.url}" target="_blank"><img src="${item.img}" /></a>`;
                dom.appendChild(img);
            });
        }
    </script>
</body>
</html>
